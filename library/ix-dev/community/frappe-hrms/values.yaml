image:
  repository: miketkb910/frappe-hrms
  pullPolicy: IfNotPresent
  tag: latest

resources:
  limits:
    cpu: 4000m
    memory: 8Gi

frappeHrmsConfig:
  additionalEnvs: []

frappeHrmsNetwork:
  webPort: 30080
  certificateID:
  hostNetwork: false

frappeHrmsRunAs:
  user: 1000
  group: 1000

frappeHrmsStorage:
  data:
    type: ixVolume
    ixVolumeConfig:
      datasetName: data
  additionalStorages: []
