runAsContext:
  - userName: root
    groupName: root
    gid: 0
    uid: 0
    description: Shoutrrr runs as root and drops privileges to www-data
capabilities:
  - name: NET_BIND_SERVICE
    description: Shoutrrr is able to bind to network ports.
  - name: CHOWN
    description: Shoutrrr is able to chown files.
  - name: DAC_OVERRIDE
    description: Shoutrrr is able to bypass permission checks.
  - name: FOWNER
    description: Shoutrrr is able to adjust file permissions.
  - name: SETUID
    description: Shoutrrr is able to switch user ID.
  - name: SETGID
    description: Shoutrrr is able to switch group ID.
  - name: SETPCAP
    description: Shoutrrr is able to modify process capabilities.
  - name: SETFCAP
    description: Shoutrrr is able to set file capabilities.
  - name: KILL
    description: Shoutrrr is able to send process signals.
  - name: SYS_PTRACE
    description: Shoutrrr is able to trace processes for Octane/FrankenPHP.
hostMounts: []
