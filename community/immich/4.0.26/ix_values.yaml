image:
  repository: altran1502/immich-server
  pullPolicy: IfNotPresent
  tag: v3.3.4
mlImage:
  repository: altran1502/immich-machine-learning
  pullPolicy: IfNotPresent
  tag: v3.3.4
mlCudaImage:
  repository: altran1502/immich-machine-learning
  pullPolicy: IfNotPresent
  tag: v3.3.4-cuda
mlOpenvinoImage:
  repository: altran1502/immich-machine-learning
  pullPolicy: IfNotPresent
  tag: v3.3.4-openvino
pgvectorImage:
  repository: tensorchord/pgvecto-rs
  pullPolicy: IfNotPresent
  tag: pg15-v0.2.0
resources:
  limits:
    cpu: 4000m
    memory: 8Gi
immichGPU: {}
immichConfig:
  publicLoginMessage: ''
  enableML: true
  mlImageType: mlImage
  logLevel: log
  huggingFaceEndpoint: ''
immichNetwork:
  webuiPort: 30041
  machinelearningPort: 32002
immichStorage:
  uploads:
    type: ixVolume
    ixVolumeConfig:
      datasetName: uploads
  library:
    type: ixVolume
    ixVolumeConfig:
      datasetName: library
  thumbs:
    type: ixVolume
    ixVolumeConfig:
      datasetName: thumbs
  profile:
    type: ixVolume
    ixVolumeConfig:
      datasetName: profile
  video:
    type: ixVolume
    ixVolumeConfig:
      datasetName: video
  additionalLibraries: []
  pgData:
    type: ixVolume
    ixVolumeConfig:
      datasetName: pgData
  pgBackup:
    type: ixVolume
    ixVolumeConfig:
      datasetName: pgBackup
notes:
  custom: "## Database\nYou can connect to the database using the pgAdmin App from\
    \ the catalog\n\n<details>\n  <summary>Database Details</summary>\n\n  - Database:\
    \ `immich`\n  - Username: `immich`\n  - Password: `{{ .Values.immichDbPass }}`\n\
    \  - Host:     `{{ .Values.immichDbHost }}.{{ .Release.Namespace }}.svc.cluster.local`\n\
    \  - Port:     `5432`\n\n</details>\n{{- $_ := unset .Values \"immichDbPass\"\
    \ }}\n{{- $_ := unset .Values \"immichDbHost\" }}\n"
