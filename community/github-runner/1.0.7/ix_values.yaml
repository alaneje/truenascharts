image:
  repository: myoung34/github-runner
  pullPolicy: IfNotPresent
  tag: latest

resources:
  limits:
    cpu: 2000m
    memory: 4Gi

githubRunnerConfig:
  url: ""
  token: ""
  name: ""
  labels: ""
  additionalEnvs: []

githubRunnerRunAs:
  user: 1000
  group: 1000

githubRunnerNetwork:
  hostNetwork: false

githubRunnerStorage:
  mountDockerSocket: false
  additionalStorages: []
