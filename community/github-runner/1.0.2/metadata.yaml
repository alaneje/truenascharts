runAsContext:
  - userName: root
    groupName: root
    gid: 0
    uid: 0
    description: GitHub Runner requires root to configure its directories and drop privileges.
capabilities:
  - name: SETUID
    description: GitHub Runner requires this ability to switch user.
  - name: SETGID
    description: GitHub Runner requires this ability to switch group.
  - name: CHOWN
    description: GitHub Runner requires this ability to chown files.
  - name: FOWNER
    description: GitHub Runner requires this ability to bypass file ownership checks.
  - name: DAC_OVERRIDE
    description: GitHub Runner requires this ability to bypass file permission checks.
hostMounts: []
